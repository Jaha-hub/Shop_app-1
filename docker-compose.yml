version: "3.9"

services:
  db:
    image: postgres:16
    container_name: shop_app2
    ports:
      - "5435:5432"  # Внешний порт 5435 -> внутренний 5432
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app2
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    command: >
      sh -c "sleep 5 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
